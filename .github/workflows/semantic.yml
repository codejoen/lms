name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - uses: step-security/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
